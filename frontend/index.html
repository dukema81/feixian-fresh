<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞系电商</title>
<style>
  :root { --ink:#1f2328; --sub:#57606a; --line:#d8dee4; --brand:#15803d; --panel:#f6f8fa; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Microsoft YaHei","PingFang SC",sans-serif; color:var(--ink); background:#fff; }
  header { display:flex; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid var(--line); }
  header img { width:36px; height:36px; border-radius:8px; }
  header b { font-size:17px; }
  header .tag { color:var(--sub); font-size:12px; }
  .spacer { flex:1; }
  button { cursor:pointer; border:1px solid var(--line); background:#fff; border-radius:6px; padding:6px 14px; font-size:13px; }
  button.primary { background:var(--brand); color:#fff; border-color:var(--brand); }
  button.danger { color:#cf222e; }
  nav.tabs { display:flex; gap:4px; padding:8px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  nav.tabs button { border:none; background:none; padding:8px 12px; border-radius:6px; font-size:14px; }
  nav.tabs button.on { background:var(--panel); color:var(--brand); font-weight:600; }
  main { padding:20px; max-width:1200px; margin:0 auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
  .card { border:1px solid var(--line); border-radius:10px; padding:14px; }
  .card h4 { font-size:15px; margin-bottom:6px; }
  .card .price { color:#cf222e; font-weight:700; margin:6px 0; }
  .card .meta { color:var(--sub); font-size:12px; }
  table { border-collapse:collapse; width:100%; font-size:13px; margin-top:10px; }
  th,td { border:1px solid var(--line); padding:7px 10px; text-align:left; }
  th { background:var(--panel); white-space:nowrap; }
  .toolbar { display:flex; gap:8px; margin:10px 0; flex-wrap:wrap; align-items:center; }
  input,select,textarea { border:1px solid var(--line); border-radius:6px; padding:7px 10px; font-size:13px; font-family:inherit; }
  .stat-row { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:16px; }
  .stat { border:1px solid var(--line); border-radius:10px; padding:14px 20px; min-width:140px; }
  .stat b { font-size:22px; display:block; }
  .stat span { color:var(--sub); font-size:12px; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; }
  .modal .box { background:#fff; border-radius:12px; padding:20px; width:440px; max-height:85vh; overflow:auto; }
  .modal h3 { margin-bottom:12px; }
  .form-row { margin-bottom:10px; }
  .form-row label { display:block; font-size:12px; color:var(--sub); margin-bottom:4px; }
  .form-row input,.form-row select,.form-row textarea { width:100%; }
  .cart-line { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--line); font-size:13px; }
  .toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); background:#1f2328; color:#fff; padding:8px 18px; border-radius:20px; font-size:13px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <img id="logo" alt="logo">
  <div><b id="brandName">飞系电商</b><div class="tag" id="brandTag"></div></div>
  <div class="spacer"></div>
  <span id="whoami" class="tag"></span>
  <button id="btnCart">购物车</button>
  <button id="btnLogin">登录</button>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<div id="modalRoot"></div>
<script src="app.js"></script>
</body>
</html>
